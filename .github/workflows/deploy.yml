name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [develop]  # GitHub Pagesは確認環境(develop専用)。mainは将来Cloudflareで公開
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 手動実行(workflow_dispatch)でも develop 以外からはデプロイしない
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
    steps:
      - name: Hugoをインストール
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Pagesの設定を取得
        id: pages
        uses: actions/configure-pages@v6

      - name: ビルド
        run: hugo --gc --minify --cleanDestinationDir --environment preview --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: ビルド結果をアップロード
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v5
