<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>株式会社サンプルテスト from dev 14:30</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="./" class="logo">株式会社サンプルテスト from dev 14:30</a>
    <nav>
      <a href="./">ホーム</a>
      <a href="about.html">会社概要</a>
      <a href="news/">ニュース</a>
      <a href="contact.html">お問い合わせ</a>
    </nav>
  </header>
  <main class="container">
    <h1>ようこそ</h1>
    <section>
      <h2>最新ニュース</h2>
      <ul id="latest-news" class="news-list"><li>読み込み中…</li></ul>
      <p><a href="news/">ニュース一覧を見る &raquo;</a></p>
    </section>
  </main>
  <footer class="site-footer"><p>&copy; 株式会社サンプル from dev 14:30</p></footer>
  <script>
    fetch('news/index.json')
      .then(r => r.json())
      .then(items => {
        const ul = document.getElementById('latest-news');
        ul.innerHTML = '';
        items.forEach(n => {
          const li = document.createElement('li');
          li.innerHTML = `<time>${n.date}</time> <span class="category">${n.category}</span> `;
          const a = document.createElement('a');
          a.href = n.url;
          a.textContent = n.title;
          li.appendChild(a);
          ul.appendChild(li);
        });
      })
      .catch(() => {
        document.getElementById('latest-news').innerHTML = '<li>ニュースを読み込めませんでした</li>';
      });
  </script>
</body>
</html>
